<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>プレビュー</title>
  <style>
    body { margin: 0; padding: 32px; background: #f3f4f6; color: #111;
           font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    .menu { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; margin: 16px 0; }
    button { padding: 6px 12px; font: inherit; cursor: pointer; }
    code { background: #e5e7eb; padding: 0 4px; border-radius: 3px; }
  </style>
</head>
<body>
  <h1>Environment Ribbon プレビュー</h1>
  <p>Tampermonkey に入れずにスクリプトを試すためのページです。設定はこのブラウザの localStorage に保存します。<br>
    下のボタンは Tampermonkey のメニューの代わりです。</p>
  <div class="menu" id="menu"></div>
  <button id="clear">保存した設定を消す</button>
  <p>初回は <code>file://*</code> にマッチするルールを入れてあるので、このページにリボンが出ます。</p>

  <script>
    const PREFIX = 'environment-ribbon-preview:';
    if (localStorage.getItem(PREFIX + 'config') === null) {
      localStorage.setItem(PREFIX + 'config', JSON.stringify({
        defaults: { position: 'top-right', size: 'medium', prefixTabTitle: true },
        rules: [{ match: 'file://*', label: 'PREVIEW' }],
      }));
    }

    window.GM_getValue = (key, fallback) => {
      const v = localStorage.getItem(PREFIX + key);
      return v === null ? fallback : JSON.parse(v);
    };
    window.GM_setValue = (key, value) => localStorage.setItem(PREFIX + key, JSON.stringify(value));
    window.GM_registerMenuCommand = (name, fn) => {
      const btn = document.createElement('button');
      btn.textContent = name;
      btn.onclick = fn;
      document.getElementById('menu').appendChild(btn);
    };

    document.getElementById('clear').onclick = () => {
      Object.keys(localStorage).filter((k) => k.startsWith(PREFIX)).forEach((k) => localStorage.removeItem(k));
      location.reload();
    };
  </script>
  <script src="../environment-ribbon.user.js"></script>
</body>
</html>
